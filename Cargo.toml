[package]
name = "loam"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/salishdev/loam"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustyline = { version = "19", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4"
thiserror = "2"
